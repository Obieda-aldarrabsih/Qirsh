version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qirsh_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://qirsh:qirsh_secret@postgres:5432/qirsh_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=qirsh-production-super-secret-at-least-32-chars-long!
      - LOG_LEVEL=info
      - SEED_DEMO=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: qirsh_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=qirsh
      - POSTGRES_PASSWORD=qirsh_secret
      - POSTGRES_DB=qirsh_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qirsh -d qirsh_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qirsh_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
